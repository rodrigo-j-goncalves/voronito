<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World's 30 Largest Companies (by sector)</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: "Helvetica Neue", Arial, sans-serif; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  #chart-container { width: 100%; max-width: 836.0px; }
  svg { width: 100%; height: auto; display: block; }
  .cell {
    stroke: #FFFFFF;
    stroke-width: 1.5;
    stroke-linejoin: round;
    cursor: pointer;
    transition: opacity 150ms ease, stroke-width 150ms ease;
  }
  .cell.dimmed { opacity: 0.35; }
  #hover-highlight {
    fill: none;
    stroke: #222222;
    stroke-width: 3;
    stroke-linejoin: round;
    pointer-events: none;
    display: none;
  }
  .cell-label {
    font-family: "Helvetica Neue", Arial, sans-serif;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
    transition: opacity 150ms ease;
  }
  #tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(20, 20, 20, 0.92);
    color: #FAFAFA;
    padding: 8px 11px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.45;
    max-width: 260px;
    opacity: 0;
    transition: opacity 120ms ease;
    z-index: 10;
  }
  #tooltip .tt-name { font-weight: 600; font-size: 14px; }
  #tooltip .tt-path { opacity: 0.75; font-size: 11.5px; margin-bottom: 3px; }
</style>
</head>
<body>
<div id="chart-container">
  <svg viewBox="-18 141.662 836 516.676">
    <defs></defs>
    <g id="voronoi-treemap"></g>
  </svg>
</div>
<div id="tooltip"></div>
<script>
const CELLS = [{"id": "Energy", "name": "Energy", "color": "#D55E00", "value": 43.9, "description": null, "d": "M468.83,165.15 L561.27,386.21 L717.26,365.91 L749.87,316.67 L709.66,165.15 Z", "centroid": [619.3625711512982, 265.12501453527864], "area": 45816.72923186437, "parentId": "Companies", "breadcrumb": "World's 30 Largest Companies (by sector) \u203a Energy", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": 20.0}, {"id": "Finance", "name": "Finance", "color": "#009E73", "value": 62.6, "description": null, "d": "M486.03,634.85 L780.00,634.85 L780.00,408.09 L717.26,365.91 L561.27,386.21 Z", "centroid": [650.9673846401275, 513.3143287637432], "area": 65272.484345013974, "parentId": "Companies", "breadcrumb": "World's 30 Largest Companies (by sector) \u203a Finance", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": 20.0}, {"id": "Auto", "name": "Auto", "color": "#E69F00", "value": 9.9, "description": null, "d": "M20.00,165.15 L20.00,325.86 L130.76,191.23 L115.29,165.15 Z", "centroid": [60.81129400225193, 220.84780290216287], "area": 10142.759452923066, "parentId": "Companies", "breadcrumb": "World's 30 Largest Companies (by sector) \u203a Auto", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": 20.0}, {"id": "Tech", "name": "Tech", "color": "#56B4E9", "value": 207.9, "description": null, "d": "M20.00,504.23 L126.37,634.85 L486.03,634.85 L561.27,386.21 L468.83,165.15 L172.33,165.15 L130.76,191.23 L20.00,325.86 Z", "centroid": [287.54414014982734, 404.06575491521994], "area": 216831.98249180755, "parentId": "Companies", "breadcrumb": "World's 30 Largest Companies (by sector) \u203a Tech", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": 20.0}, {"id": "Health", "name": "Health", "color": "#CC79A7", "value": 7.2, "description": null, "d": "M709.66,165.15 L749.87,316.67 L780.00,315.98 L780.00,165.15 Z", "centroid": [753.518272556435, 230.68634679860256], "area": 7601.709466858949, "parentId": "Companies", "breadcrumb": "World's 30 Largest Companies (by sector) \u203a Health", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": null}, {"id": "Retail", "name": "Retail", "color": "#0072B2", "value": 6.5, "description": null, "d": "M126.37,634.85 L20.00,504.23 L20.00,634.85 Z", "centroid": [55.45597384815759, 591.3124506031406], "area": 6946.963167131307, "parentId": "Companies", "breadcrumb": "World's 30 Largest Companies (by sector) \u203a Retail", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": null}, {"id": "Utilities", "name": "Utilities", "color": "#F0E442", "value": 2.0, "description": null, "d": "M780.00,315.98 L749.87,316.67 L717.26,365.91 L780.00,408.09 Z", "centroid": [757.0602126992104, 357.1767947212137], "area": 3620.031765540887, "parentId": "Companies", "breadcrumb": "World's 30 Largest Companies (by sector) \u203a Utilities", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": null}, {"id": "RealEstate", "name": "Real Estate", "color": "#9B9B9B", "value": 1.1, "description": null, "d": "M115.29,165.15 L130.76,191.23 L172.33,165.15 Z", "centroid": [139.46104436352263, 173.840495003222], "area": 743.7719807989761, "parentId": "Companies", "breadcrumb": "World's 30 Largest Companies (by sector) \u203a Real Estate", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": null}];

const svg = d3.select("svg g#voronoi-treemap");
const tooltip = d3.select("#tooltip");

const cellSel = svg.selectAll("path.cell")
  .data(CELLS, d => d.id)
  .enter()
  .append("path")
  .attr("class", "cell")
  .attr("id", d => "cell-" + d.id)
  .attr("d", d => d.d)
  .attr("fill", d => d.color);

const labeled = CELLS.filter(d => d.labelFontSize !== null);

d3.select("svg defs").selectAll("clipPath")
  .data(labeled, d => d.id)
  .enter()
  .append("clipPath")
  .attr("id", d => "clip-" + d.id)
  .append("path")
  .attr("d", d => d.d);

const labelSel = svg.selectAll("text.cell-label")
  .data(labeled)
  .enter()
  .append("text")
  .attr("class", "cell-label")
  .attr("x", d => d.centroid[0])
  .attr("y", d => d.centroid[1])
  .attr("font-size", d => d.labelFontSize)
  .attr("fill", d => textColorFor(d.color))
  .attr("clip-path", d => "url(#clip-" + d.id + ")")
  .text(d => d.name);

const hoverHighlight = svg.append("path").attr("id", "hover-highlight");

function textColorFor(hex) {
  hex = hex.replace("#", "");
  const r = parseInt(hex.substring(0, 2), 16);
  const g = parseInt(hex.substring(2, 4), 16);
  const b = parseInt(hex.substring(4, 6), 16);
  const luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  return luminance > 0.6 ? "#111111" : "#FAFAFA";
}

function fmtValue(v) {
  return (Math.round(v * 1000) / 1000).toString();
}

cellSel
  .on("mouseenter", function (event, d) {
    cellSel.classed("dimmed", o => o.parentId !== d.parentId);
    d3.select(this).classed("dimmed", false);
    hoverHighlight.attr("d", d.d).style("display", "inline");

    tooltip.html(
      '<div class="tt-path">' + d.breadcrumb + '</div>' +
      '<div class="tt-name">' + d.name + '</div>' +
      '<div>' + fmtValue(d.value) + ' per $100 revenue</div>' +
      '<div>' + d.pctParent.toFixed(1) + '% of parent &middot; ' + d.pctTotal.toFixed(2) + '% of total</div>'
    ).style("opacity", 1);
  })
  .on("mousemove", function (event) {
    tooltip
      .style("left", (event.clientX + 16) + "px")
      .style("top", (event.clientY + 16) + "px");
  })
  .on("mouseleave", function () {
    cellSel.classed("dimmed", false);
    hoverHighlight.style("display", "none");
    tooltip.style("opacity", 0);
  });
</script>
</body>
</html>
