<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global Biomass Distribution</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: "Helvetica Neue", Arial, sans-serif; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  #chart-container { width: 100%; max-width: 792.0px; }
  svg { width: 100%; height: auto; display: block; }
  .cell {
    stroke: #FFFFFF;
    stroke-width: 1.5;
    stroke-linejoin: round;
    cursor: pointer;
    transition: opacity 150ms ease, stroke-width 150ms ease;
  }
  .cell.dimmed { opacity: 0.35; }
  #hover-highlight {
    fill: none;
    stroke: #222222;
    stroke-width: 3;
    stroke-linejoin: round;
    pointer-events: none;
    display: none;
  }
  .cell-label {
    font-family: "Helvetica Neue", Arial, sans-serif;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
    transition: opacity 150ms ease;
  }
  #tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(20, 20, 20, 0.92);
    color: #FAFAFA;
    padding: 8px 11px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.45;
    max-width: 260px;
    opacity: 0;
    transition: opacity 120ms ease;
    z-index: 10;
  }
  #tooltip .tt-name { font-weight: 600; font-size: 14px; }
  #tooltip .tt-path { opacity: 0.75; font-size: 11.5px; margin-bottom: 3px; }
</style>
</head>
<body>
<div id="chart-container">
  <svg viewBox="4 180 792 440">
    <defs></defs>
    <g id="voronoi-treemap"></g>
  </svg>
</div>
<div id="tooltip"></div>

r": "#964200", "value": 0.7, "description": "Marine and freshwater fish.", "d": "M554.82,566.53 L561.01,563.96 L580.00,555.00 L593.45,547.88 L576.49,529.10 Z", "centroid": [574.8892847448136, 548.1162930160542], "area": 536.2346482980065, "parentId": "Animals", "breadcrumb": "Living Earth \u203a Animals \u203a Fish", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": 8.104859308865626}, {"id": "Mollusks", "name": "Mollusks", "color": "#A84A00", "value": 0.2, "description": "Includes bivalves, gastropods, cephalopods.", "d": "M594.86,504.03 L592.95,514.63 L606.73,519.39 L611.25,512.50 Z", "centroid": [601.191440605745, 512.3314234032521], "area": 153.25499476314872, "parentId": "Animals", "breadcrumb": "Living Earth \u203a Animals \u203a Mollusks", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": null}, {"id": "Annelids", "name": "Annelids", "color": "#BA5200", "value": 0.2, "description": "Segmented worms, including earthworms.", "d": "M615.38,535.26 L617.92,533.76 L628.31,526.94 L626.62,521.96 L615.47,521.85 L611.08,526.11 L611.66,531.00 L615.09,535.04 Z", "centroid": [618.9312233632943, 527.332344035242], "area": 152.1455110333627, "parentId": "Animals", "breadcrumb": "Living Earth \u203a Animals \u203a Annelids", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": null}, {"id": "Cnidarians", "name": "Cnidarians", "color": "#CC5A00", "value": 0.1, "description": "Jellyfish, corals, and relatives.", "d": "M583.56,516.88 L592.95,514.63 L594.86,504.03 L591.89,502.49 Z", "centroid": [590.32895278138, 510.3560190747514], "area": 75.31987098045647, "parentId": "Animals", "breadcrumb": "Living Earth \u203a Animals \u203a Cnidarians", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": null}, {"id": "Livestock", "name": "Livestock", "color": "#DE6200", "value": 0.1, "description": "Domesticated mammals raised by humans (cattle, pigs, etc.).", "d": "M611.25,512.50 L606.73,519.39 L611.08,526.11 L615.47,521.85 L615.36,514.62 Z", "centroid": [611.7014113118, 519.0628923813783], "area": 74.48968399735168, "parentId": "Animals", "breadcrumb": "Living Earth \u203a Animals \u203a Livestock", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": null}, {"id": "Humans", "name": "Humans", "color": "#F06A00", "value": 0.06, "description": "Global human biomass.", "d": "M627.19,520.73 L615.36,514.62 L615.47,521.85 L626.62,521.96 Z", "centroid": [619.8661724217194, 519.4107743971185], "area": 49.29142704687547, "parentId": "Animals", "breadcrumb": "Living Earth \u203a Animals \u203a Humans", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": null}, {"id": "Nematodes", "name": "Nematodes", "color": "#FF7203", "value": 0.02, "description": "Roundworms; extremely numerous but small individual mass.", "d": "M628.31,526.94 L633.11,523.79 L627.19,520.73 L626.62,521.96 Z", "centroid": [629.2570566339116, 523.7443137128258], "area": 19.11843087800662, "parentId": "Animals", "breadcrumb": "Living Earth \u203a Animals \u203a Nematodes", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": null}, {"id": "Wildmammals", "name": "Wild mammals", "color": "#FF7D15", "value": 0.007, "description": "All non-domesticated mammals combined.", "d": "M610.95,535.06 L615.09,535.04 L611.66,531.00 Z", "centroid": [612.5652974484464, 533.6980901218143], "area": 8.402708308945876, "parentId": "Animals", "breadcrumb": "Living Earth \u203a Animals \u203a Wild mammals", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": null}, {"id": "Wildbirds", "name": "Wild birds", "color": "#FF8728", "value": 0.002, "description": "All wild bird species combined.", "d": "M615.38,535.26 L615.09,535.04 L610.95,535.06 L609.75,538.59 Z", "centroid": [612.125456381365, 536.2379475425441], "area": 8.391843802237418, "parentId": "Animals", "breadcrumb": "Living Earth \u203a Animals \u203a Wild birds", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": null}, {"id": "Viruses", "name": "Viruses", "color": "#F0E442", "value": 0.2, "description": "Estimated viral biomass across environments.", "d": "M598.99,255.06 L580.00,245.00 L561.01,236.05 L545.52,229.59 L587.67,299.56 L612.58,263.09 Z", "centroid": [581.8118238228565, 263.2634955898375], "area": 1717.1270595316237, "parentId": "LivingEarth", "breadcrumb": "Living Earth \u203a Viruses", "pctParent": 100.0, "pctTotal": 100.0, "labelFontSize": null}];

const svg = d3.select("svg g#voronoi-treemap");
const tooltip = d3.select("#tooltip");

const cellSel = svg.selectAll("path.cell")
  .data(CELLS, d => d.id)
  .enter()
  .append("path")
  .attr("class", "cell")
  .attr("id", d => "cell-" + d.id)
  .attr("d", d => d.d)
  .attr("fill", d => d.color);

const labeled = CELLS.filter(d => d.labelFontSize !== null);

d3.select("svg defs").selectAll("clipPath")
  .data(labeled, d => d.id)
  .enter()
  .append("clipPath")
  .attr("id", d => "clip-" + d.id)
  .append("path")
  .attr("d", d => d.d);

const labelSel = svg.selectAll("text.cell-label")
  .data(labeled)
  .enter()
  .append("text")
  .attr("class", "cell-label")
  .attr("x", d => d.centroid[0])
  .attr("y", d => d.centroid[1])
  .attr("font-size", d => d.labelFontSize)
  .attr("fill", d => textColorFor(d.color))
  .attr("clip-path", d => "url(#clip-" + d.id + ")")
  .text(d => d.name);

const hoverHighlight = svg.append("path").attr("id", "hover-highlight");

function textColorFor(hex) {
  hex = hex.replace("#", "");
  const r = parseInt(hex.substring(0, 2), 16);
  const g = parseInt(hex.substring(2, 4), 16);
  const b = parseInt(hex.substring(4, 6), 16);
  const luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  return luminance > 0.6 ? "#111111" : "#FAFAFA";
}

function fmtValue(v) {
  return (Math.round(v * 1000) / 1000).toString();
}

cellSel
  .on("mouseenter", function (event, d) {
    cellSel.classed("dimmed", o => o.parentId !== d.parentId);
    d3.select(this).classed("dimmed", false);
    hoverHighlight.attr("d", d.d).style("display", "inline");

    tooltip.html(
      '<div class="tt-path">' + d.breadcrumb + '</div>' +
      '<div class="tt-name">' + d.name + '</div>' +
      '<div>' + fmtValue(d.value) + ' Gt C</div>' +
      '<div>' + d.pctParent.toFixed(1) + '% of parent &middot; ' + d.pctTotal.toFixed(2) + '% of total</div>'
    ).style("opacity", 1);
  })
  .on("mousemove", function (event) {
    tooltip
      .style("left", (event.clientX + 16) + "px")
      .style("top", (event.clientY + 16) + "px");
  })
  .on("mouseleave", function () {
    cellSel.classed("dimmed", false);
    hoverHighlight.style("display", "none");
    tooltip.style("opacity", 0);
  });
</script>
</body>
</html>
